[project]
name = "llm-wiki-agent"
version = "0.1.0"
description = "Maintenance CLI for an LLM Wiki markdown vault: generated index, log sharding, vault migration"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wiki = "llm_wiki_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
